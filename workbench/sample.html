<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>How many more patients to validate?</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"><script defer src="stats.js"></script><script defer src="sample.js"></script></head><body>
<header><h1>How many more patients to validate?</h1><nav><a href="index.html">Workbench</a><a href="audits/index.html">Published studies</a><a href="trial.html">Timed study</a></nav></header>
<main class="bench">
<div class="steps">
<section class="sec"><h2><b>1</b>Pilot</h2><div class="body"><label aria-description="Patients whose calls were reported after the rule was frozen. Retests stay out of this count.">Reported calls<input type="number" id="pilot-n" min="0" max="100000" value="17"></label><label>Wrong calls<input type="number" id="pilot-e" min="0" max="10000" value="2"></label><label aria-description="Largest share of wrong calls you accept among reported patients">Target error (%)<input type="number" id="pilot-alpha" min="0.01" max="99.99" step="1" value="10"></label><button id="sample-run" class="go">Calculate</button></div></section>
<div id="sample-error" role="alert" hidden></div>
</div>
<section class="sec obj" id="sample-results" hidden><h2><b>2</b>Plan</h2><p id="sample-answer" aria-description="A minimum at 95% one-sided confidence, assuming zero further wrong calls. Fix the validation size in advance; stopping early changes the coverage. Use independent patients and a rule frozen before their outcomes."></p><div id="sample-metrics" class="metrics"></div><p id="sample-assumption"></p><button id="sample-export" class="quiet">Download calculation</button></section>
</main></body></html>
