<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="545" viewBox="0 0 1160 545">
<rect width="1160" height="545" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#111} .title{font-size:26px;font-weight:700} .sub{font-size:15px;fill:#444} .lab{font-size:16px} .num{font-size:18px;font-weight:700}</style>
<text x="44" y="48" class="title">Review Contract Map: where the sample order breaks</text>
<text x="44" y="77" class="sub">34 Bhaduri sample keys; rows change eligibility, error endpoint or order. 1.0 = equal-key mean.</text>
<line x1="540" y1="115" x2="540" y2="385" stroke="#777" stroke-dasharray="4 4"/>
<text x="531" y="107" class="sub">1.0</text>
<text x="44" y="147" class="lab">Selected / HNOCA / fixed score</text>
<rect x="540.0" y="130" width="137.0" height="22" fill="#1a6a51"/>
<text x="810" y="147" class="num">1.721×</text>
<text x="44" y="202" class="lab">Selected / author binary / fixed score</text>
<rect x="540.0" y="185" width="163.5" height="22" fill="#1a6a51"/>
<text x="810" y="202" class="num">1.860×</text>
<text x="44" y="257" class="lab">All rows / review findings / fixed score</text>
<rect x="540.0" y="240" width="83.9" height="22" fill="#1a6a51"/>
<text x="810" y="257" class="num">1.441×</text>
<text x="44" y="312" class="lab">All rows / review findings / rescored</text>
<rect x="505.6" y="295" width="34.4" height="22" fill="#a3412c"/>
<text x="810" y="312" class="num">0.819×</text>
<text x="44" y="367" class="lab">All rows / review findings / combined</text>
<rect x="509.6" y="350" width="30.4" height="22" fill="#a3412c"/>
<text x="810" y="367" class="num">0.840×</text>
<line x1="44" y1="410" x2="1116" y2="410" stroke="#aaa"/>
<text x="44" y="444" class="title" font-size="18">Separate OoC image decision tradeoff</text>
<text x="44" y="475" class="lab">Same 38 images: good-image false flags 3 → 9; bad-image misses 4 → 0.</text>
<text x="44" y="505" class="sub">Post hoc prefix selection; different image training/validation protocols. No cell–image pooled metric, causal claim, or prospective saving.</text>
</svg>
